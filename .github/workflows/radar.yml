name: EverSquad Free AI Radar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Radar Health Check
        run: node scripts/check-radar.mjs
      - name: Commit and push updated radar status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/radar-status.json
          git diff --staged --quiet || (git commit -m "chore(radar): update live free AI status" && git push)
